{% extends 'base.html' %}

{% block content %}
  <style>
    /* Dashboard layout fix */
    .dashboard-wrapper {
      height: calc(100vh - 56px); /* Adjust based on your actual navbar height */
      overflow: hidden;
      background-color: #f8f9fa; /* Light grey background for the whole page */
    }
    
    /* Sidebar Styling */
    .sidebar {
      height: 100%;
      background: #ffffff;
      border-right: 1px solid #e5e7eb;
      box-shadow: 4px 0 10px rgba(0, 0, 0, 0.02);
      z-index: 10;
    }
    
    /* Main content scroll */
    .dashboard-main {
      height: 100%;
      overflow-y: auto;
      background-color: #f8f9fa;
    }
    
    /* Sidebar Nav Links */
    .sidebar .nav-link {
      color: #4b5563; /* Medium grey */
      font-size: 0.95rem;
      font-weight: 500;
      padding: 0.8rem 1rem;
      margin: 0.2rem 0.75rem;
      border-radius: 8px;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
    }
    
    .sidebar .nav-link i {
      width: 20px;
      font-size: 1.1rem;
      margin-right: 12px;
      text-align: center;
    }
    
    /* Hover & Active States */
    .sidebar .nav-link:hover {
      background-color: #f3f4f6;
      color: #1f2937;
      transform: translateX(4px);
    }
    
    .sidebar .nav-link.active {
      background-color: #4338ca; /* Indigo primary */
      color: #ffffff;
      box-shadow: 0 4px 6px -1px rgba(67, 56, 202, 0.2);
    }
    
    /* Profile Section Styling */
    .user-profile-section {
      padding: 2rem 1rem;
      background: linear-gradient(to bottom, #ffffff, #fcfcfd);
    }
    
    .avatar-circle {
      width: 48px;
      height: 48px;
      background: #e0e7ff;
      color: #4338ca;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      margin: 0 auto 12px;
    }
  </style>

  <!-- IMPORTANT: NO container-fluid padding -->
  <div class="dashboard-wrapper d-flex">
    <!-- SIDEBAR -->
    <div class="sidebar border-end bg-white h-100 flex-shrink-0" style="width:260px;">
      {% include 'includes/student_sidebar.html' %}
    </div>

    <!-- CONTENT -->
    <div class="flex-grow-1 d-flex flex-column h-100">
      <div class="flex-grow-1 overflow-auto p-4">
        {% block dashboard_content %}
        {% endblock %}
      </div>
    </div>
  </div>
{% endblock %}
