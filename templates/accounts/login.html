{% extends "base.html" %}

{% block title %}Login | StudentMS{% endblock %}

{% block content %}
<div class="d-flex align-items-center justify-content-center" style="min-height: 80vh;">
  <div class="col-md-4 col-sm-10">

    <div class="card border-0 shadow-lg rounded-4 overflow-hidden">

      <!-- PREMIUM HEADER (VISIBLE NOW) -->
      <div class="py-4 text-white text-center" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
        <i class="fas fa-user-circle fa-2x mb-2"></i>
        <h5 class="fw-bold mb-0">Welcome Back</h5>
      </div>

      <div class="card-body p-4 p-md-5">

        <!-- Auth Errors -->
        {% if form.non_field_errors %}
        <div class="alert alert-danger border-0 rounded-3 py-2 mb-4">
          <i class="fas fa-exclamation-circle me-2"></i>
          {{ form.non_field_errors }}
        </div>
        {% endif %}

        <form method="post" novalidate>
          {% csrf_token %}

          <!-- Username -->
          <div class="mb-4">
            <label class="form-label small fw-semibold text-muted">USERNAME</label>
            <div class="input-group input-group-lg">
              <span class="input-group-text bg-light border-end-0">
                <i class="fas fa-user text-muted"></i>
              </span>
              <input type="text" name="username" value="{{ form.username.value|default:'' }}"
                class="form-control border-start-0" placeholder="Enter your username">
            </div>
          </div>

          <!-- Password -->
          <div class="mb-4">
            <label class="form-label small fw-semibold text-muted">PASSWORD</label>
            <div class="input-group input-group-lg">
              <span class="input-group-text bg-light border-end-0">
                <i class="fas fa-lock text-muted"></i>
              </span>
              <input type="password" name="password" class="form-control border-start-0"
                placeholder="Enter your password">
            </div>
          </div>

          <!-- Submit -->
          <button type="submit" class="btn btn-lg w-100 rounded-3 fw-semibold py-3" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                         color: white;">
            <i class="fas fa-sign-in-alt me-2"></i> Sign In
          </button>
        </form>

        <!-- Footer -->
        <div class="text-center mt-4 pt-3 border-top">
          <p class="small text-muted mb-2">
            Don’t have an account?
            <a href="{% url 'register' %}" class="fw-semibold text-decoration-none">
              Create Account
            </a>
          </p>
          <a href="{% url 'password_reset' %}" class="small text-muted text-decoration-none">
            <i class="fas fa-key me-1"></i> Forgot Password?
          </a>
        </div>

      </div>
    </div>

  </div>
</div>
{% endblock %}
