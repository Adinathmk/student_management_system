{% extends "admin/admin_base.html" %}

{% block title %}Enroll Student{% endblock %}

{% block content %}

<div class="d-flex justify-content-center align-items-center min-vh-100">
    <div class="card border-0 shadow-sm rounded-4 p-4 admin-form-card">

        <h5 class="fw-semibold mb-4">Enroll Student</h5>

        <form method="post" novalidate>
            {% csrf_token %}

            <!-- STUDENT -->
            <div class="mb-3">
                <label class="form-label">Student *</label>
                <select name="student" class="form-select form-select-lg" required>
                    <option value="">Select student</option>
                    {% for student in students %}
                        <option value="{{ student.id }}">
                            {{ student.username }} ({{ student.email }})
                        </option>
                    {% endfor %}
                </select>
            </div>

            <!-- COURSE -->
            <div class="mb-3">
                <label class="form-label">Course *</label>
                <select name="course" class="form-select form-select-lg" required>
                    <option value="">Select course</option>
                    {% for course in courses %}
                        <option value="{{ course.id }}">
                            {{ course.course_code }} - {{ course.title }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <!-- STATUS -->
            <div class="mb-4">
                <label class="form-label">Status</label>
                <select name="status" class="form-select">
                    <option value="pending">Pending</option>
                    <option value="in_progress">In Progress</option>
                    <option value="completed">Completed</option>
                </select>
            </div>

            <!-- ACTIONS -->
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary px-4">
                    Enroll
                </button>
                <a href="{% url 'admin_panel:enrollments' %}" class="btn btn-light">
                    Cancel
                </a>
            </div>

        </form>

    </div>
</div>

{% endblock %}
