{% extends "admin/admin_base.html" %}

{% block title %}Edit Enrollment{% endblock %}

{% block content %}

<div class="d-flex justify-content-center align-items-center min-vh-100">
    <div class="card border-0 shadow-sm rounded-4 p-4 admin-form-card">

        <h5 class="fw-semibold mb-4">
            Edit Enrollment
        </h5>

        <form method="post" novalidate>
            {% csrf_token %}

            <!-- STUDENT -->
            <div class="mb-3">
                <label class="form-label">Student *</label>
                <select name="student"
                        class="form-select form-select-lg"
                        required>
                    {% for student in students %}
                        <option value="{{ student.id }}"
                            {% if enrollment.student.id == student.id %}
                                selected
                            {% endif %}>
                            {{ student.username }} ({{ student.email }})
                        </option>
                    {% endfor %}
                </select>
            </div>

            <!-- COURSE -->
            <div class="mb-3">
                <label class="form-label">Course *</label>
                <select name="course"
                        class="form-select form-select-lg"
                        required>
                    {% for course in courses %}
                        <option value="{{ course.id }}"
                            {% if enrollment.course.id == course.id %}
                                selected
                            {% endif %}>
                            {{ course.course_code }} - {{ course.title }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <!-- STATUS -->
            <div class="mb-4">
                <label class="form-label">Status</label>
                <select name="status" class="form-select">
                    <option value="pending"
                        {% if enrollment.status == "pending" %}selected{% endif %}>
                        Pending
                    </option>
                    <option value="in_progress"
                        {% if enrollment.status == "in_progress" %}selected{% endif %}>
                        In Progress
                    </option>
                    <option value="completed"
                        {% if enrollment.status == "completed" %}selected{% endif %}>
                        Completed
                    </option>
                </select>
            </div>

            <!-- ACTIONS -->
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary px-4">
                    Save Changes
                </button>
                <a href="{% url 'admin_panel:enrollments' %}"
                   class="btn btn-light">
                    Cancel
                </a>
            </div>

        </form>

    </div>
</div>

{% endblock %}
