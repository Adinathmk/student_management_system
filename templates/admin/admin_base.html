<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>
      {% block title %}
        Admin
      {% endblock %}
    </title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    {% load static %}

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />

    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet" />

    <!-- ADMIN CSS -->
    <link rel="stylesheet" href="{% static 'admin/admin.css' %}" />
  </head>

  <body>
    <div class="d-flex min-vh-100">
      <!-- SIDEBAR -->
      <aside class="sidebar d-flex flex-column">
        <div class="profile border-bottom border-light border-opacity-25">
          <div class="profile-circle mb-2">AD</div>
          <div class="fw-semibold">Admin</div>
          <small class="opacity-75">Administrator</small>
        </div>

        <ul class="nav flex-column mt-3 px-2">
          <li>
            <a class="nav-link {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}" href="{% url 'admin_panel:dashboard' %}"><i class="fas fa-users me-2"></i>Dashboard</a>
          </li>
          <li>
            <a class="nav-link {% if request.resolver_match.url_name == 'students' %}active{% endif %}" href="{% url 'admin_panel:students' %}"><i class="fas fa-user-graduate me-2"></i>Students Management</a>
          </li>
          <li>
            <a class="nav-link {% if request.resolver_match.url_name == 'courses' %}active{% endif %}" href="{% url 'admin_panel:courses' %}"><i class="fas fa-book me-2"></i>Courses Management</a>
          </li>
          <li>
            <a class="nav-link {% if request.resolver_match.url_name == 'enrollments' %}active{% endif %}" href="{% url 'admin_panel:enrollments' %}"><i class="fas fa-clipboard-list me-2"></i>Enrollments</a>
          </li>
        </ul>

        <div class="mt-auto px-3 pb-3">
          <a class="nav-link text-danger" href="{% url 'logout' %}"><i class="fas fa-sign-out-alt me-2"></i>Logout</a>
        </div>
      </aside>

      <!-- MAIN -->
      <main class="content">
        <div class="position-fixed top-0 start-50 translate-middle-x mt-2" style="z-index: 1080; width: 90%; max-width: 600px;">
          {% if messages %}
            {% for message in messages %}
              <div class="alert alert-{{ message.tags }} alert-dismissible fade show shadow" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
              </div>
            {% endfor %}
          {% endif %}
        </div>
        {% block content %}
        {% endblock %}
      </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
