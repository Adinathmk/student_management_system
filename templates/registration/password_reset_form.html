<div style="
    max-width: 420px;
    margin: 80px auto;
    padding: 30px;
    margin-top:250px;
    border-radius: 12px;
    background: #ffffff;
    box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    font-family: Arial, sans-serif;
">

    <div style="
        text-align: center;
        font-size: 44px;
        margin-bottom: 10px;
    ">
        🔑
    </div>

    <h2 style="
        text-align: center;
        margin-bottom: 10px;
        color: #333;
    ">
        Reset Your Password
    </h2>

    <p style="
        text-align: center;
        font-size: 14px;
        color: #666;
        margin-bottom: 25px;
    ">
        Enter your registered email address and we’ll send you a link to reset your password.
    </p>

    <form method="post">
        {% csrf_token %}

        <div style="margin-bottom: 20px;">
            {{ form.as_p }}
        </div>

        <button type="submit" onclick="this.disabled=true; this.form.submit();" style="
            width: 100%;
            padding: 12px;
            background-color: #0d6efd;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        ">
            Send Reset Link
        </button>
    </form>
</div>
