<div style="
    max-width: 420px;
    margin: 80px auto;
    padding: 30px;
    border-radius: 12px;
    margin-top:250px;
    background: #ffffff;
    box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    font-family: Arial, sans-serif;
">

    <h2 style="
        text-align: center;
        margin-bottom: 10px;
        color: #333;
    ">
        🔐 Set New Password
    </h2>

    <p style="
        text-align: center;
        font-size: 14px;
        color: #666;
        margin-bottom: 25px;
    ">
        Please enter your new password below.
    </p>

    <form method="post">
        {% csrf_token %}

        <div style="margin-bottom: 15px;">
            {{ form.as_p }}
        </div>

        <button type="submit" style="
            width: 100%;
            padding: 12px;
            background-color: #0d6efd;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        ">
            Reset Password
        </button>
    </form>
</div>
